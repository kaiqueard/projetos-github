<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário</title>
</head>

<body>
    <h1>Qustionário</h1>
    <label>Qual o seu nome?</label>
    <input type="text" placeholder="Digite seu nome">
    <p></p>
    <label>Qual será sua senha?</label>
    <input type="password" placeholder="Digite sua senha">
    <p></p>
    <label>Qual a sua idade?</label>
    <input type="number" placeholder="Digite sua idade">
    <p></p>
    <label>Quanto está gostando do site?</label>
    <input type="range">
    <p></p>
    <label>Marque se você possui alguma deficiência</label>
    <input type="checkbox">
    <p></p>
    <label>Quando você nasceu?</label>
    <input type="date">
    <p></p>
    <label>Que mês você está atualmente?</label>
    <input type="month">
    <p></p>
    <label>Qual seu número de telefone?</label>
    <input type="tel">
    <p></p>
    <label>Qual semana estamos?</label>
    <input type="week">
    <p></p>
    <label>Que horas são agora?</label>
    <input type="time">
</body>

</html>
